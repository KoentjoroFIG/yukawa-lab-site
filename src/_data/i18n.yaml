  hero_title: クロマチンの開き方が、細胞の運命を決める。
  hero_lede: 私たちは愛媛大学で、T細胞や疾患においてゲノムがどのように折りたたまれ、ほどかれるのかを、エピゲノム実験とバイオインフォマティクスを組み合わせて研究しています。
  see_research: 研究内容を見る
  fiber_label: クロマチンが開く位置
  fiber_desc: クロマチン線維のアニメーション。DNAがヒストンに巻き付いています。線維が開いた場所ではヌクレオソームが離れ、転写因子AP-1が露出したDNAに結合し、下のアクセシビリティのシグナルがピークとして立ち上がります。左右の矢印キーで開く位置を動かせます。
  fiber_track: クロマチンアクセシビリティ
  fiber_hint: 線維に沿ってポインタを動かすと、T細胞の活性化のようにクロマチンが開きます。
  fiber_hint_touch: 線維に沿ってドラッグすると、T細胞の活性化のようにクロマチンが開きます。

  research: 研究内容
  research_intro: 研究室には二つの問いがあります。免疫細胞はクロマチンをどのように再構成して遺伝子をオンにするのか。そして、分子データから疾患をどう読み解くのか。
