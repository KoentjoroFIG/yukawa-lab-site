# Lab members, in the order they appear on the site.
#
# Required:  name, role
# Optional:  short_name   shorter name for cards
#            since        year they joined
#            photo        file in src/assets/img/people/ (480x512 works best);
#                         without one, the site shows the member's initials
#            summary      one or two sentences about their work
#            project      what they're working on in the lab
#            education, experience, awards, expertise   lists of short lines
#            links        list of { text, url }
#            alumni: true moves someone to "Former members"
#
# Japanese: add the same field name ending in _ja (role_ja, bio_ja,
#            summary_ja, project_ja, awards_ja, ...) on one line. Anything
#            without a _ja version is shown in English on the Japanese site.

